
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Edit Profile - J1</title>

</head>


<body class="profile-body">


    <h1>Edit Profile</h1>


    <form id="profileForm">


        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label for="age">
            Age
        </label>

        <input
            type="number"
            id="age"
            placeholder="Enter your age"
        >


        <label for="location">
            Location
        </label>

        <input
            type="text"
            id="location"
            placeholder="Enter your location"
        >


        <label for="school">
            School
        </label>

        <input
            type="text"
            id="school"
            placeholder="Enter your school"
        >


        <label for="college">
            College
        </label>

        <input
            type="text"
            id="college"
            placeholder="Enter your college"
        >


        <label for="degree">
            Degree
        </label>

        <input
            type="text"
            id="degree"
            placeholder="Enter your degree"
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >


        <button type="submit">
            Save Profile
        </button>

    </form>


    <br>


    <a href="profile.html">
        Back to Profile
    </a>


    <script src="edit-profile.js"></script>

</body>

</html>
