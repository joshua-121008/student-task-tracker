
<!DOCTYPE html>

<body class="profile-body">


    <h1>Profile</h1>


    <!-- Profile Picture -->

    <img
        id="profilePicture"
        src="images/profile.jpg"
        alt="Profile Picture"
        width="200"
        height="200"
    >


    <!-- User Details -->

    <div class="profile-details">

        <p>
            Name:
            <span id="userName">Not added</span>
        </p>


        <p>
            Age:
            <span id="userAge">Not added</span>
        </p>


        <p>
            Location:
            <span id="userLocation">Not added</span>
        </p>


        <p>
            School:
            <span id="userSchool">Not added</span>
        </p>


        <p>
            College:
            <span id="userCollege">Not added</span>
        </p>


        <p>
            Degree:
            <span id="userDegree">Not added</span>
        </p>


        <p>
            Email:
            <span id="userEmail">Not added</span>
        </p>

    </div>


    <!-- Edit -->

    <a href="edit-profile.html">

        <button>
            Edit Profile
        </button>

    </a>
