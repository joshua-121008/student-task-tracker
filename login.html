
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Login - J1</title>
</head>

<body class="login-body">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p>Login</p>


        <form id="loginForm">

            <!-- Email -->
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- Password -->
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <!-- Login Button -->
            <button type="submit">
                Login
            </button>

        </form>


        <!-- Message -->
        <p id="loginMessage"></p>


        <!-- Back -->
       <p>
    Don't have an account?
    <a href="signup.html">Sign Up</a>
</p>

<a href="home.html">
    Back to Home
</a>

    </div>


    <script src="login.js"></script>

</body>
</html>
