<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tasks - J1</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="tasks-body">


    <header>

        <h1>Tasks</h1>

        <h2>Manage and organize your tasks</h2>

    </header>


    <!-- Navigation -->

    <nav>

        <div class="nav-links">

            <a href="index.html">Back to Home</a>

            <a href="profile.html">Profile</a>

            <a href="add-tasks.html">Add Tasks</a>

        </div>

    </nav>


    <!-- Filter buttons -->

    <div class="buttons">

        <button id="allBtn">
            All
        </button>

        <button id="completedBtn">
            Completed
        </button>

        <button id="pendingBtn">
            Pending
        </button>

    </div>


    <!-- Tasks will appear here -->

    <div
        class="task-container"
        id="taskContainer"
    >

    </div>


    <!-- Edit Dialog -->

    <dialog id="editDialog">

        <h2>Edit Task</h2>

        <form id="editForm">

            <label for="editTitle">
                Task Title
            </label>

            <input
                type="text"
                id="editTitle"
                required
            >


            <label for="editDescription">
                Description
            </label>

            <textarea
                id="editDescription"
                rows="4"
            ></textarea>


            <label for="editCategory">
                Category
            </label>

            <select id="editCategory">

                <option value="College">
                    College
                </option>

                <option value="Personal">
                    Personal
                </option>

                <option value="Project">
                    Project
                </option>

                <option value="Work">
                    Work
                </option>

            </select>


            <label for="editPriority">
                Priority
            </label>

            <select id="editPriority">

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

            </select>


            <label for="editDueDate">
                Due Date
            </label>

            <input
                type="date"
                id="editDueDate"
            >


            <label for="editStatus">
                Status
            </label>

            <select id="editStatus">

                <option value="Pending">
                    Pending
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>


            <div class="dialog-buttons">

                <button type="submit">
                    Save Changes
                </button>

                <button
                    type="button"
                    id="cancelEdit"
                >
                    Cancel
                </button>

            </div>

        </form>

    </dialog>


    <!-- Delete Dialog -->

    <dialog id="deleteDialog">

        <h2>Delete Task?</h2>

        <p>Are you sure you want to delete this task?</p>


        <div class="dialog-buttons">

            <button
                id="cancelDelete"
                type="button"
            >
                Cancel
            </button>

            <button
                id="confirmDelete"
                type="button"
            >
                Delete
            </button>

        </div>

    </dialog>


    <!-- jQuery -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- Tasks JavaScript -->

    <script src="tasks.js"></script>


</body>

</html>
